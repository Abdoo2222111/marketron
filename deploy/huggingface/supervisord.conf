# ============================================================
# Supervisor Configuration for MARKETRON AI Suite
# ============================================================

[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
pidfile=/tmp/supervisord.pid

# ── Keep-Alive Monitor ─────────────────────────────────────
[program:keep-alive]
command=python3 /app/keep_alive.py
directory=/app
autostart=true
autorestart=true
startretries=999
startsecs=5
stderr_logfile=/app/logs/keep-alive.err.log
stdout_logfile=/app/logs/keep-alive.out.log
priority=10

# ── Backend API (:4000) ────────────────────────────────────
[program:backend]
command=npx prisma db push --accept-data-loss && node /app/backend/dist/index.js
directory=/app/backend
environment=NODE_ENV="production",PORT="4000"
autostart=true
autorestart=true
startretries=999
startsecs=10
stderr_logfile=/app/logs/backend.err.log
stdout_logfile=/app/logs/backend.out.log
priority=100

# ── AI Services (:8000) ────────────────────────────────────
[program:ai-services]
command=node /app/ai-services/dist/index.js
directory=/app/ai-services
environment=NODE_ENV="production",PORT="8000"
autostart=true
autorestart=true
startretries=999
startsecs=10
stderr_logfile=/app/logs/ai-services.err.log
stdout_logfile=/app/logs/ai-services.out.log
priority=200

# ── Social Integrations (:3003) ────────────────────────────
[program:integrations]
command=node /app/integrations/dist/index.js
directory=/app/integrations
environment=NODE_ENV="production",PORT="3003"
autostart=true
autorestart=true
startretries=999
startsecs=10
stderr_logfile=/app/logs/integrations.err.log
stdout_logfile=/app/logs/integrations.out.log
priority=300

# ── Hugging Face Web Service (:7860) ───────────────────────
[program:hf-server]
command=python3 /app/server.py
directory=/app
environment=PORT="7860"
autostart=true
autorestart=true
startretries=999
startsecs=10
stderr_logfile=/app/logs/hf-server.err.log
stdout_logfile=/app/logs/hf-server.out.log
priority=400

[eventlistener:supervisor-cron]
command=python3 /app/keep_alive.py
events=PROCESS_STATE
