# ============================================================
# Deploy to Hugging Face Spaces
# ============================================================
name: 🚀 Deploy to Hugging Face

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'ai-services/**'
      - 'integrations/**'
      - 'deploy/huggingface/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend + AI + Integrations
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Login to Hugging Face
        uses: docker/login-action@v3
        with:
          registry: hf.space
          username: ${{ secrets.HF_USERNAME }}
          password: ${{ secrets.HF_TOKEN }}

      - name: 🏗️ Build and push to HF Space
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/huggingface/Dockerfile
          push: true
          tags: hf.space/${{ secrets.HF_USERNAME }}/marketron-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-evolution:
    name: Deploy Evolution API
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Login to Hugging Face
        uses: docker/login-action@v3
        with:
          registry: hf.space
          username: ${{ secrets.HF_USERNAME }}
          password: ${{ secrets.HF_TOKEN }}

      - name: 🏗️ Build and push Evolution API to HF Space
        uses: docker/build-push-action@v5
        with:
          context: ./evolution-api-deploy
          file: evolution-api-deploy/Dockerfile
          push: true
          tags: hf.space/${{ secrets.HF_USERNAME }}/marketron-evolution:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
