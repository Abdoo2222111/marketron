<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none">
  <defs>
    <!-- Main M gradient (left side - deep blue to purple) -->
    <linearGradient id="gradMLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="40%" style="stop-color:#3b82f6"/>
      <stop offset="70%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <!-- Main M gradient (right side - cyan to electric blue) -->
    <linearGradient id="gradMRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="30%" style="stop-color:#06B6D4"/>
      <stop offset="60%" style="stop-color:#22D3EE"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <!-- Arrow gradient -->
    <linearGradient id="gradArrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06B6D4"/>
      <stop offset="50%" style="stop-color:#22D3EE"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <!-- Circuit pattern gradient -->
    <linearGradient id="gradCircuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#67e8f9;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#a5f3fc;stop-opacity:0.6"/>
    </linearGradient>
    <!-- Text gradient -->
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7C3AED" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- === THE M LETTERFORM === -->
  <g filter="url(#shadow)">
    <!-- Left ribbon of M -->
    <path d="M 180 420 L 180 160 L 280 120 L 380 280 L 380 120 L 400 110 L 420 120 L 420 280 L 520 120 L 620 160 L 620 420 L 540 420 L 540 260 L 460 400 L 440 420 L 360 420 L 340 400 L 260 260 L 260 420 Z"
          fill="url(#gradMLeft)" stroke="none"/>
    
    <!-- Right ribbon of M (overlapping) -->
    <path d="M 320 420 L 320 200 L 400 320 L 480 200 L 480 420 L 560 420 L 560 160 L 460 100 L 400 80 L 340 100 L 240 160 L 240 420 Z"
          fill="url(#gradMRight)" opacity="0.85" stroke="none"/>
    
    <!-- Upward arrow (integrated into M) -->
    <g filter="url(#glow)">
      <path d="M 520 180 L 600 100 L 680 180 L 640 180 L 640 280 L 560 280 L 560 180 Z"
            fill="url(#gradArrow)" stroke="none"/>
      <!-- Arrow shaft extension -->
      <path d="M 580 280 L 580 340 L 620 340 L 620 280 Z"
            fill="url(#gradArrow)" opacity="0.7" stroke="none"/>
    </g>

    <!-- Circuit pattern overlay on M -->
    <g stroke="url(#gradCircuit)" stroke-width="1.5" fill="none" opacity="0.7">
      <!-- Horizontal circuit lines -->
      <line x1="200" y1="200" x2="350" y2="200"/>
      <line x1="200" y1="240" x2="320" y2="240"/>
      <line x1="200" y1="280" x2="340" y2="280"/>
      <line x1="200" y1="320" x2="310" y2="320"/>
      <line x1="200" y1="360" x2="330" y2="360"/>
      
      <line x1="450" y1="200" x2="600" y2="200"/>
      <line x1="470" y1="240" x2="600" y2="240"/>
      <line x1="460" y1="280" x2="600" y2="280"/>
      <line x1="480" y1="320" x2="600" y2="320"/>
      <line x1="470" y1="360" x2="600" y2="360"/>
      
      <!-- Vertical circuit lines -->
      <line x1="240" y1="180" x2="240" y2="380"/>
      <line x1="280" y1="160" x2="280" y2="400"/>
      <line x1="320" y1="140" x2="320" y2="400"/>
      <line x1="520" y1="140" x2="520" y2="400"/>
      <line x1="560" y1="160" x2="560" y2="380"/>
      <line x1="600" y1="180" x2="600" y2="360"/>
      
      <!-- Diagonal circuit lines -->
      <line x1="220" y1="220" x2="340" y2="340"/>
      <line x1="460" y1="340" x2="580" y2="220"/>
      <line x1="340" y1="160" x2="460" y2="280"/>
      
      <!-- Circuit nodes (dots) -->
      <circle cx="240" cy="200" r="4" fill="url(#gradCircuit)"/>
      <circle cx="280" cy="240" r="4" fill="url(#gradCircuit)"/>
      <circle cx="320" cy="280" r="4" fill="url(#gradCircuit)"/>
      <circle cx="240" cy="320" r="4" fill="url(#gradCircuit)"/>
      <circle cx="280" cy="360" r="4" fill="url(#gradCircuit)"/>
      
      <circle cx="520" cy="200" r="4" fill="url(#gradCircuit)"/>
      <circle cx="560" cy="240" r="4" fill="url(#gradCircuit)"/>
      <circle cx="600" cy="280" r="4" fill="url(#gradCircuit)"/>
      <circle cx="520" cy="320" r="4" fill="url(#gradCircuit)"/>
      <circle cx="560" cy="360" r="4" fill="url(#gradCircuit)"/>
      
      <!-- Gear icons (simplified) -->
      <circle cx="300" cy="300" r="8" stroke-width="2"/>
      <circle cx="300" cy="300" r="3" fill="url(#gradCircuit)"/>
      <line x1="300" y1="290" x2="300" y2="285"/>
      <line x1="300" y1="310" x2="300" y2="315"/>
      <line x1="290" y1="300" x2="285" y2="300"/>
      <line x1="310" y1="300" x2="315" y2="300"/>
      
      <circle cx="500" cy="300" r="8" stroke-width="2"/>
      <circle cx="500" cy="300" r="3" fill="url(#gradCircuit)"/>
      <line x1="500" y1="290" x2="500" y2="285"/>
      <line x1="500" y1="310" x2="500" y2="315"/>
      <line x1="490" y1="300" x2="485" y2="300"/>
      <line x1="510" y1="300" x2="515" y2="300"/>
      
      <!-- Small circuit dots scattered -->
      <circle cx="260" cy="220" r="2.5" fill="url(#gradCircuit)"/>
      <circle cx="340" cy="260" r="2.5" fill="url(#gradCircuit)"/>
      <circle cx="220" cy="300" r="2.5" fill="url(#gradCircuit)"/>
      <circle cx="300" cy="340" r="2.5" fill="url(#gradCircuit)"/>
      <circle cx="260" cy="380" r="2.5" fill="url(#gradCircuit)"/>
      
      <circle cx="540" cy="220" r="2.5" fill="url(#gradCircuit)"/>
      <circle cx="460" cy="260" r="2.5" fill="url(#gradCircuit)"/>
      <circle cx="580" cy="300" r="2.5" fill="url(#gradCircuit)"/>
      <circle cx="500" cy="340" r="2.5" fill="url(#gradCircuit)"/>
      <circle cx="540" cy="380" r="2.5" fill="url(#gradCircuit)"/>
    </g>
  </g>

  <!-- === TEXT: MARKETRON === -->
  <text x="400" y="480" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="56" letter-spacing="8" fill="url(#gradText)" filter="url(#glow)">
    MARKETRON
  </text>

  <!-- === SUBTEXT: MARKETING + AUTOMATION === -->
  <text x="400" y="520" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="6" fill="url(#gradText)" opacity="0.8">
    MARKETING + AUTOMATION
  </text>
</svg>
