<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <!-- Left ribbon: deep blue to purple -->
    <linearGradient id="leftRib" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="50%" style="stop-color:#3730a3"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <!-- Right ribbon: cyan to electric blue -->
    <linearGradient id="rightRib" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="50%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <!-- Arrow gradient -->
    <linearGradient id="arrowGr" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <!-- Text gradient -->
    <linearGradient id="txtGr" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <!-- Shadow -->
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Left ribbon -->
  <path d="M130 80 L175 50 Q195 40 200 60 L230 230 Q235 250 220 260 L195 270 Q175 275 165 255 L130 110 Q120 85 130 80Z" fill="url(#leftRib)" filter="url(#sh)"/>
  <path d="M145 95 L180 70 Q188 68 190 78 L215 230 L200 240 L175 235 L145 110 Q142 100 145 95Z" fill="rgba(255,255,255,0.15)"/>

  <!-- Right ribbon -->
  <path d="M470 80 L425 50 Q405 40 400 60 L370 230 Q365 250 380 260 L405 270 Q425 275 435 255 L470 110 Q480 85 470 80Z" fill="url(#rightRib)" filter="url(#sh)"/>
  <path d="M455 95 L420 70 Q412 68 410 78 L385 230 L400 240 L425 235 L455 110 Q458 100 455 95Z" fill="rgba(255,255,255,0.25)"/>

  <!-- Circuit patterns on right ribbon -->
  <g stroke="white" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M425 90 L440 95 L440 120"/>
    <path d="M405 110 L420 115 L420 140"/>
    <path d="M445 130 L450 140 L450 165"/>
    <path d="M415 160 L430 165 L430 190"/>
  </g>
  <g fill="white" opacity="0.8">
    <circle cx="440" cy="120" r="2.5"/><circle cx="420" cy="140" r="2.5"/>
    <circle cx="450" cy="165" r="2.5"/><circle cx="430" cy="190" r="2.5"/>
  </g>

  <!-- Center M peak -->
  <path d="M220 270 L280 60 Q300 35 320 60 L380 270 L340 270 L305 175 Q300 165 295 175 L260 270Z" fill="url(#rightRib)" filter="url(#sh)"/>
  <path d="M240 265 L290 80 Q300 70 310 80 L360 265 L335 265 L305 180 Q300 170 295 180 L265 265Z" fill="rgba(255,255,255,0.2)"/>

  <!-- Circuit details on center -->
  <g stroke="white" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M270 130 L285 140 L285 160"/>
    <path d="M315 140 L330 150 L330 170"/>
  </g>
  <g fill="white" opacity="0.8">
    <circle cx="285" cy="160" r="2.5"/><circle cx="330" cy="170" r="2.5"/>
  </g>

  <!-- Upward Arrow -->
  <path d="M300 25 L345 110 Q350 120 340 120 L320 120 L320 200 L280 200 L280 120 L260 120 Q250 120 255 110Z" fill="url(#arrowGr)" filter="url(#sh)"/>
  <path d="M300 40 L325 95 L310 95 L310 190 L290 190 L290 95 L275 95Z" fill="rgba(255,255,255,0.25)"/>

  <!-- Gear icons -->
  <g fill="white" opacity="0.4">
    <g transform="translate(160,180)">
      <circle cx="0" cy="0" r="8" fill="white"/><circle cx="0" cy="0" r="3" fill="url(#rightRib)"/>
      <rect x="-1" y="-12" width="2" height="4" fill="white"/><rect x="-1" y="8" width="2" height="4" fill="white"/>
      <rect x="-12" y="-1" width="4" height="2" fill="white"/><rect x="8" y="-1" width="4" height="2" fill="white"/>
    </g>
    <g transform="translate(440,180)">
      <circle cx="0" cy="0" r="7" fill="white"/><circle cx="0" cy="0" r="2.5" fill="url(#rightRib)"/>
      <rect x="-1" y="-10" width="2" height="3" fill="white"/><rect x="-1" y="7" width="2" height="3" fill="white"/>
      <rect x="-10" y="-1" width="3" height="2" fill="white"/><rect x="7" y="-1" width="3" height="2" fill="white"/>
    </g>
  </g>

  <!-- MARKETRON text -->
  <text x="300" y="340" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900" text-anchor="middle" fill="url(#txtGr)" letter-spacing="2" filter="url(#sh)">MARKETRON</text>
  <text x="300" y="340" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900" text-anchor="middle" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5" letter-spacing="2">MARKETRON</text>

  <!-- Subtext -->
  <text x="300" y="385" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1e3a8a" letter-spacing="4">MARKETING + AUTOMATION</text>
</svg>