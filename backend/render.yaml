# MARKETRON Backend — Render Blueprint (Free Tier)
services:
  - type: web
    name: marketron-api
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DB_PROVIDER
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: marketron-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://marketron.vercel.app
      - key: CORS_ORIGIN
        value: https://marketron.vercel.app
      - key: LOG_LEVEL
        value: info
      - key: UPLOAD_DIR
        value: ./uploads
      - key: OPENAI_API_KEY
        sync: false  # will prompt user

databases:
  - name: marketron-db
    plan: free
    region: frankfurt
    databaseType: postgresql
    ipAllowList: [] # allow all
