services:
  postgres:
    image: postgres:15-alpine
    container_name: marketron_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketron
      POSTGRES_PASSWORD: marketron_secret_2026
      POSTGRES_DB: marketron
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketron"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: marketron_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketron_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://marketron:marketron_secret_2026@postgres:5432/marketron
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: marketron-access-secret-2026
      JWT_REFRESH_SECRET: marketron-refresh-secret-2026
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: debug
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_logs:
