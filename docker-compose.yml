version: '3.9'

services:
  # ── PostgreSQL Database ─────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: marketing_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-marketing}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-marketing_secret_2026}
      POSTGRES_DB: ${DB_NAME:-marketing_platform}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketing"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache & Queues ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: marketing_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../deployment/backend/Dockerfile.backend
    container_name: marketing_backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-marketing}:${DB_PASSWORD:-marketing_secret_2026}@postgres:5432/${DB_NAME:-marketing_platform}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super-secret-refresh-key-change-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-https://app.example.com}
    volumes:
      - backend_uploads:/app/uploads
      - ./backend/logs:/app/logs
    command: >
      sh -c "npx prisma generate && npx prisma db push && node dist/index.js"

  # ── AI Services ─────────────────────────────────────────
  ai-services:
    build:
      context: ./ai-services
      dockerfile: ../deployment/ai-services/Dockerfile.ai
    container_name: marketing_ai
    restart: unless-stopped
    ports:
      - "${AI_PORT:-3002}:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      REDIS_URL: redis://redis:6379

  # ── Integrations Service ────────────────────────────────
  integrations:
    build:
      context: ./integrations
      dockerfile: ../deployment/Dockerfile.integrations
    container_name: marketing_integrations
    restart: unless-stopped
    ports:
      - "${INTEGRATIONS_PORT:-3003}:3003"
    environment:
      NODE_ENV: production
      PORT: 3003
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      TIKTOK_APP_ID: ${TIKTOK_APP_ID:-}
      TIKTOK_APP_SECRET: ${TIKTOK_APP_SECRET:-}
      SNAPCHAT_APP_ID: ${SNAPCHAT_APP_ID:-}
      SNAPCHAT_APP_SECRET: ${SNAPCHAT_APP_SECRET:-}
      REDIS_URL: redis://redis:6379

  # ── Nginx Reverse Proxy ────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: marketing_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - ai-services
      - integrations

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
