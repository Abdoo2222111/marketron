# ============================================================
# Render Blueprint (Infrastructure as Code)
# منصة التسويق الإلكتروني - Backend
# ============================================================

services:
  # ── Web Service: Backend API ───────────────────────────────
  - type: web
    name: marketing-platform-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    branch: main

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: API_PREFIX
        value: /api
      - key: DATABASE_URL
        fromDatabase:
          name: marketing-platform-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"
      - key: REDIS_URL
        value: "" # Redis is optional for free tier
      - key: CORS_ORIGIN
        value: https://marketing-platform.vercel.app
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "200"
      - key: LOG_LEVEL
        value: info
      - key: SENTRY_DSN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

# ── Database: PostgreSQL ─────────────────────────────────────
databases:
  - name: marketing-platform-db
    databaseType: postgresql
    region: oregon
    plan: free
    ipAllowList: [] # Allow all connections (required for Render free tier)
