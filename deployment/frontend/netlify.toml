[build]
  command = "npm run build"
  publish = "dist"
  base = "../frontend"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.(js|css|jpg|png|svg|ico|woff2)"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[dev]
  framework = "vite"
  command = "npm run dev"
  targetPort = 5173
